# Probe: which runs-on labels have capacity in the mirego org?
# Runs a trivial job on each candidate label. Green run = that label works.
name: Runner Label Probe

on:
  workflow_dispatch: {}
  push:
    branches: [dinesh/t_0f7041be-ci-pipeline]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        label: [ubuntu-latest, ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 5
    steps:
      - name: Identify runner
        run: |
          echo "label=${{ matrix.label }}"
          echo "runner name: $RUNNER_NAME"
          echo "runner os: $RUNNER_OS $ImageOS 2>/dev/null || true"
          echo "is github-hosted (ImageOS set + no 'self-hosted' label check below):"
          echo "  expected labels: ${{ join(matrix.label, ' ') }}"
          uname -a
