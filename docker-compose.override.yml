# Local override — NOT stock upstream.
# Mounts gilfoyle cluster SSH key so sparkDash can poll every Spark via SSH (uniform N-node).
services:
  sparkdash:
    network_mode: host
    volumes:
      - /home/gilfoyle/.ssh/id_ed25519:/root/.ssh/id_ed25519:ro
      - /home/gilfoyle/.ssh/id_ed25519.pub:/root/.ssh/id_ed25519.pub:ro
      - /home/gilfoyle/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    environment:
      - HOME=/root
